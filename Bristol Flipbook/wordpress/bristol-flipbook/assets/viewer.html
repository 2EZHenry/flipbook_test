<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Bristol Catalogue Viewer</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
		/>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
		<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
		<script>
			pdfjsLib.GlobalWorkerOptions.workerSrc =
				"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
		</script>

		<style>
			:root {
				--brand-green: #96c93d;
				--text-dark: #333333;
				--surface: #f6f6f2;
				--panel: #ffffff;
				--line: rgba(0, 0, 0, 0.12);
				--shadow: 0 24px 48px rgba(0, 0, 0, 0.12);
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
				margin: 0;
				overflow: hidden;
			}

			body {
				background: radial-gradient(
						circle at top,
						rgba(132, 189, 0, 0.12),
						transparent 26%
					),
					linear-gradient(180deg, #fcfcf9 0%, var(--surface) 100%);
				color: var(--text-dark);
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
					Arial, sans-serif;
				display: flex;
				flex-direction: column;
			}

			.top-toolbar {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 12px;
				color: #ffffff;
				background: var(--brand-green);
				box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
				font-size: 16px;
				z-index: 5;
			}

			.page-info-text {
				font-weight: 600;
				letter-spacing: 0.02em;
			}

			.toolbar-right {
				display: flex;
				align-items: center;
				gap: 6px;
				flex-wrap: wrap;
			}
			#fullscreenStatus { position: fixed; bottom: 80px; left: 16px; right: 16px; z-index: 30; background: white; color: #333; padding: 12px; border-radius: 8px; }
			@media (max-width: 480px) { .top-toolbar { gap: 8px; flex-wrap: wrap; font-size: 13px; } .btn { padding: 6px 8px; } }

			.btn {
				cursor: pointer;
				border: 1px solid rgba(255, 255, 255, 0.35);
				background: rgba(255, 255, 255, 0.16);
				color: #ffffff;
				border-radius: 999px;
				padding: 6px 11px;
				font-size: 13px;
				min-width: 34px;
				text-align: center;
				user-select: none;
				transition: background 0.15s, transform 0.1s, border-color 0.15s;
				backdrop-filter: blur(8px);
			}

			.btn:hover {
				background: rgba(255, 255, 255, 0.24);
				border-color: rgba(255, 255, 255, 0.55);
			}

			.btn:active {
				transform: scale(0.97);
			}

			.zoom-label {
				min-width: 48px;
				text-align: center;
				font-weight: 600;
			}

			.viewer-wrapper {
				flex: 1;
				position: relative;
				overflow: hidden;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 0 74px;
			}

			.viewer-container {
				width: 100%;
				height: 100%;
				overflow: hidden;
				position: relative;
			}

			.viewer-inner {
				min-height: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 12px;
			}

			#bookStage {
				transform-origin: center center;
				transition: transform 0.18s ease;
				will-change: transform;
				padding: 24px;
			}

			#flipbook {
				margin: 0 auto;
				filter: drop-shadow(var(--shadow));
			}

			#flipbook .stf__parent {
				overflow: visible !important;
			}

			.page {
				background: var(--panel);
				overflow: hidden;
			}

			.page.page-cover {
				background: linear-gradient(
						180deg,
						rgba(132, 189, 0, 0.14) 0%,
						rgba(132, 189, 0, 0.04) 100%
					),
					var(--panel);
			}

			.page canvas {
				display: block;
				width: 100%;
				height: 100%;
				background: #ffffff;
			}

			.nav-btn {
				position: fixed;
				top: 50%;
				transform: translateY(-50%);
				width: 42px;
				height: 42px;
				border-radius: 50%;
				border: none;
				cursor: pointer;
				background: rgba(0, 0, 0, 0.58);
				color: #fff;
				font-size: 20px;
				display: flex;
				align-items: center;
				justify-content: center;
				z-index: 10;
				transition: background 0.2s, transform 0.1s, opacity 0.2s;
			}

			.nav-btn:hover:not(:disabled) {
				background: rgba(0, 0, 0, 0.78);
			}

			.nav-btn:active:not(:disabled) {
				transform: translateY(-50%) scale(0.96);
			}

			.nav-btn:disabled {
				opacity: 0.3;
				cursor: default;
			}

			.nav-left {
				left: 16px;
			}

			.nav-right {
				right: 16px;
			}

			.loader {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				z-index: 20;
				background: rgba(255, 255, 255, 0.92);
				border: 1px solid var(--line);
				box-shadow: 0 14px 32px rgba(0, 0, 0, 0.1);
				padding: 12px 14px;
				border-radius: 12px;
				font-size: 13px;
				text-align: center;
				max-width: min(420px, calc(100vw - 32px));
			}

			@media (max-width: 900px) {
				.top-toolbar {
					position: fixed;
					bottom: 0;
					left: 0;
					width: 100%;
					box-shadow: 0 -1px 4px rgba(0, 0, 0, 0.12);
				}

				.viewer-wrapper {
					padding: 18px 12px 76px;
				}

				.viewer-inner {
					padding: 4px;
				}

				.nav-left {
					left: 10px;
				}

				.nav-right {
					right: 10px;
				}

				.nav-btn {
					width: 34px;
					height: 34px;
					font-size: 18px;
				}
			}
		</style>
		<link rel="stylesheet" href="__BRISTOL_ASSET_BASE__viewer-polish.css?v=0.1.4">
	</head>
	<body>
		<div class="top-toolbar">
			<div class="page-info-text">
				Page <span id="pageCurrent">1</span> / <span id="pageTotal">0</span>
			</div>
			<div class="toolbar-right">
				<span>Syron</span>
				<button id="zoomOutBtn" class="btn" title="Zoom out">
					<i class="fa-solid fa-magnifying-glass-minus"></i>
				</button>
				<span id="zoomLabel" class="zoom-label">100%</span>
				<button id="zoomInBtn" class="btn" title="Zoom in">
					<i class="fa-solid fa-magnifying-glass-plus"></i>
				</button>
				<button id="zoomResetBtn" class="btn" title="Reset zoom">
					<i class="fa-solid fa-rotate-left"></i>
				</button>
				<button id="fullscreenBtn" class="btn" type="button" title="Enter fullscreen" aria-label="Enter fullscreen" aria-pressed="false">
					<i class="fa-solid fa-expand" aria-hidden="true"></i>
				</button>
			</div>
		</div>

		<div class="viewer-wrapper">
			<button id="prevBtn" class="nav-btn nav-left" title="Previous page">
				<i class="fa-solid fa-chevron-left"></i>
			</button>

			<div class="viewer-container" id="viewerContainer">
				<div class="viewer-inner">
					<div id="bookStage">
						<div id="flipbook"></div>
					</div>
				</div>
				<div id="panSurface" class="pan-surface" hidden aria-label="Drag to pan; drag a highlighted outer page edge inward to turn"><div id="edgeIndicator" class="edge-indicator" hidden aria-hidden="true"></div></div>
				<div class="viewer-hint">Drag to explore · Grab a page edge to turn</div>
			</div>

			<button id="nextBtn" class="nav-btn nav-right" title="Next page">
				<i class="fa-solid fa-chevron-right"></i>
			</button>
		</div>

		<div class="loader" id="loader" role="status" aria-live="polite">Opening your catalogue…</div>
		<div id="fullscreenStatus" role="status" hidden></div>
		<audio id="flipSound" src="__BRISTOL_ASSET_BASE__page-flip.wav" preload="auto"></audio>

		<script src="__BRISTOL_ASSET_BASE__page-layout.js"></script>
		<script src="__BRISTOL_ASSET_BASE__lazy-pages.js?v=0.1.2"></script>
		<script src="__BRISTOL_ASSET_BASE__fullscreen.js?v=0.1.1"></script>
		<script src="__BRISTOL_ASSET_BASE__zoom-pan.js?v=0.1.4"></script>
		<script>
			const pdfUrl = null;

			const viewerContainer = document.getElementById("viewerContainer");
			const bookStage = document.getElementById("bookStage");
			let flipbookEl = document.getElementById("flipbook");
			const prevBtn = document.getElementById("prevBtn");
			const nextBtn = document.getElementById("nextBtn");
			const zoomInBtn = document.getElementById("zoomInBtn");
			const zoomOutBtn = document.getElementById("zoomOutBtn");
			const zoomResetBtn = document.getElementById("zoomResetBtn");
			const zoomLabel = document.getElementById("zoomLabel");
			const pageCurrent = document.getElementById("pageCurrent");
			const pageTotal = document.getElementById("pageTotal");
			const loader = document.getElementById("loader");
			const flipSoundEl = document.getElementById("flipSound");

			const DEFAULT_ZOOM = 1;
			const ZOOM_LEVELS = [0.8, 0.9, 1, 1.1, 1.2, 1.35, 1.5, 1.75, 2, 2.5, 3];
			let zoomLevel = DEFAULT_ZOOM;

			let pdfDoc = null;
			let pageFlip = null;
			let bookLayout = null;
			let currentPageIndex = 0;
			let pageWidth = 0;
			let pageHeight = 0;
			let isBuilding = false;
			let lazyPages = null;
			let pageElements = [];
			let resizePending = false;
			let suppressFlipSound = true;
			let flipSoundState = "idle";
			let lastFlipSoundAt = 0;
			const zoomController = new ZoomPan({
				viewport: viewerContainer, stage: bookStage,
				surface: document.getElementById("panSurface"),
				isReady: () => !!pageFlip && !isBuilding && pageFlip.getState() === "read",
				edgeIndicator: document.getElementById("edgeIndicator"),
				getBookBounds: () => {
					if (!pageFlip) return null;
					const count = pageFlip.getOrientation() === "landscape" && (!bookLayout.showCover || currentPageIndex > 0) ? 2 : 1;
					const rects = pageElements.slice(currentPageIndex, currentPageIndex + count).map(el => el.getBoundingClientRect()).filter(rect => rect.width > 0 && rect.height > 0);
					if (!rects.length) return null;
					return { left: Math.min(...rects.map(r => r.left)), right: Math.max(...rects.map(r => r.right)), top: Math.min(...rects.map(r => r.top)), bottom: Math.max(...rects.map(r => r.bottom)), prev: !prevBtn.disabled, next: !nextBtn.disabled };
				},
				onFlip: (direction, corner) => {
					if (direction === "next" && !nextBtn.disabled) pageFlip.flipNext(corner);
					if (direction === "prev" && !prevBtn.disabled) pageFlip.flipPrev(corner);
				},
				onZoom: value => { zoomLevel = value; zoomLabel.textContent = `${Math.round(value * 100)}%`; }
			});

			const RAPID_FLIP_WINDOW_MS = 240;
			const RAPID_FLIP_PLAYBACK_RATE = 1.18;
			const NORMAL_FLIP_PLAYBACK_RATE = 1;

			function isMobile() {
				return window.innerWidth < 900;
			}

			function setZoom(value) {
				zoomController.setZoom(value);
			}

			function playFlipSound() {
				const now = performance.now();
				const isRapidFlip = now - lastFlipSoundAt < RAPID_FLIP_WINDOW_MS;
				lastFlipSoundAt = now;

				if (flipSoundState !== "idle") {
					flipSoundEl.pause();
					flipSoundEl.currentTime = 0;
				}

				flipSoundState = isRapidFlip ? "interrupting" : "playing";
				flipSoundEl.playbackRate = isRapidFlip
					? RAPID_FLIP_PLAYBACK_RATE
					: NORMAL_FLIP_PLAYBACK_RATE;

				flipSoundEl.play().catch(() => {
					flipSoundState = "idle";
				});
			}

			function getPageDimensions(page) {
				const viewport = page;
				const ratio = viewport.width / viewport.height;
				const reservedHeight = isMobile() ? 92 : 122;
				const reservedWidth = isMobile() ? 24 : 164;
				const availableHeight = Math.max(
					window.innerHeight - reservedHeight,
					280
				);
				const availableWidth = Math.max(window.innerWidth - reservedWidth, 260);
				const spreadWidth = isMobile() ? availableWidth : availableWidth / 2;

				let height = availableHeight;
				let width = height * ratio;

				if (width > spreadWidth) {
					width = spreadWidth;
					height = width / ratio;
				}

				return {
					width: Math.max(Math.floor(width), 220),
					height: Math.max(Math.floor(height), 280),
				};
			}

			async function renderPageCanvas(entry, width, height, documentToRender = pdfDoc) {
				const canvas = document.createElement("canvas");
				const ctx = canvas.getContext("2d");
				const pixelRatio = 1;
				canvas.width = Math.round(width * pixelRatio);
				canvas.height = Math.round(height * pixelRatio);
				canvas.style.width = "100%";
				canvas.style.height = "100%";
				ctx.fillStyle = "#ffffff";
				ctx.fillRect(0, 0, canvas.width, canvas.height);
				if (entry.blank) return canvas;
				const page = await documentToRender.getPage(entry.pageNumber);
				const sourceViewport = page.getViewport({ scale: 1 });
				const geometry = FlipbookLayout.renderGeometry(entry, sourceViewport, width, height, pixelRatio);
				const renderViewport = page.getViewport({ scale: geometry.scale });
				// The canvas clips the other half. Translation uses the rotated PDF viewport.
				await page.render({
					canvasContext: ctx,
					viewport: renderViewport,
					transform: [1, 0, 0, 1, geometry.x, geometry.y],
					background: "rgba(0,0,0,0)",
				}).promise;

				return canvas;
			}

			function createPageElement(entry) {
				const pageEl = document.createElement("div");
				pageEl.className = "page";
				pageEl.dataset.pageNumber = entry.blank ? "blank" : String(entry.pageNumber);
				pageEl.dataset.half = entry.half || "whole";
				pageEl.setAttribute("aria-label", entry.blank ? "Blank alignment page" : `PDF page ${entry.pageNumber}${entry.half ? `, ${entry.half} half` : ""}`);

				if (!entry.blank && !entry.half && (entry.pageNumber === 1 || entry.pageNumber === pdfDoc.numPages)) {
					pageEl.classList.add("page-cover");
					pageEl.dataset.density = "hard";
				}

				return pageEl;
			}

			async function buildFlipbook() {
				if (!pdfDoc) return;
				if (isBuilding) { resizePending = true; return; }
				isBuilding = true;
				try {
					suppressFlipSound = true;
					if (!lazyPages) {
						loader.style.display = "block";
						loader.textContent = "Preparing flipbook...";
					}

					if (pageFlip) {
						pageFlip.destroy();
						flipbookEl = document.createElement("div");
						flipbookEl.id = "flipbook";
						bookStage.replaceChildren(flipbookEl);
						pageFlip = null;
					}

					flipbookEl.innerHTML = "";

					if (!bookLayout) {
						const sourcePages = [];
						for (let n = 1; n <= pdfDoc.numPages; n++) {
							const page = await pdfDoc.getPage(n);
							sourcePages.push(page.getViewport({ scale: 1 }));
							loader.textContent = `Checking page sizes... ${n}/${pdfDoc.numPages}`;
						}
						bookLayout = FlipbookLayout.planPages(sourcePages);
					}
					const size = getPageDimensions(bookLayout.entries[0]);
					pageWidth = size.width;
					pageHeight = size.height;
					if (!lazyPages) {
						const sourceDoc = pdfDoc;
						const entries = bookLayout.entries;
						// A stable raster size can be reused in embedded and fullscreen views.
						const ratio = entries[0].width / entries[0].height;
						const rasterHeight = Math.round(1400 / Math.max(1, ratio));
						const rasterWidth = Math.round(rasterHeight * ratio);
						const renderer = new LazyPages(entries.length,
							index => renderPageCanvas(entries[index], rasterWidth, rasterHeight, sourceDoc),
							(index, canvas) => {
								if (lazyPages === renderer) {
									canvas.classList.add("page-reveal");
									pageElements[index]?.replaceChildren(canvas);
								}
							});
						lazyPages = renderer;
					}
					pageElements = [];

					for (
						let index = 0;
						index < bookLayout.entries.length;
						index += 1
					) {
						const entry = bookLayout.entries[index];
						const pageEl = createPageElement(entry);
						pageElements.push(pageEl);
						const canvas = lazyPages.cache.get(index);
						if (canvas) pageEl.appendChild(canvas);
						else if (!entry.blank) {
							const placeholder = document.createElement("div");
							placeholder.className = "page-placeholder";
							placeholder.textContent = "Preparing page";
							pageEl.appendChild(placeholder);
						}
						flipbookEl.appendChild(pageEl);
					}
					await lazyPages.get(currentPageIndex);
					await lazyPages.get(currentPageIndex + 1);

					pageFlip = new St.PageFlip(flipbookEl, {
						width: pageWidth,
						height: pageHeight,
						size: "fixed",
						showCover: bookLayout.showCover,
						usePortrait: isMobile(),
						drawShadow: true,
						flippingTime: 900,
						maxShadowOpacity: 0.38,
						mobileScrollSupport: false,
					});

					pageFlip.loadFromHTML(flipbookEl.querySelectorAll(".page"));
					currentPageIndex = Math.min(
						Math.max(currentPageIndex, 0),
						Math.max(bookLayout.entries.length - 1, 0)
					);
					pageFlip.turnToPage(currentPageIndex);
					pageFlip.update();

					pageFlip.on("flip", (event) => {
						currentPageIndex = event.data;
						zoomController.recenter();
						pageTotal.textContent = String(bookLayout.entries.length);
						pageCurrent.textContent = String(currentPageIndex + 1);
						updateNavButtons();
						lazyPages.focus(currentPageIndex).catch(handlePageError);

						if (!suppressFlipSound) {
							playFlipSound();
						}
					});

					pageFlip.on("changeOrientation", () => {
						setTimeout(() => pageFlip && pageFlip.update(), 0);
					});

					pageTotal.textContent = String(bookLayout.entries.length);
					pageTotal.parentElement.title = `${pdfDoc.numPages} PDF pages; landscape pages are divided into two halves. Blank pages keep halves together.`;
					pageCurrent.textContent = String(currentPageIndex + 1);
					updateNavButtons();
					setZoom(zoomLevel);

					suppressFlipSound = true;
					setTimeout(() => {
						suppressFlipSound = false;
					}, 250);

					loader.style.display = "none";
					document.body.classList.add("viewer-ready");
					lazyPages.focus(currentPageIndex).catch(handlePageError);
				} finally {
					isBuilding = false;
					if (resizePending) {
						resizePending = false;
						queueMicrotask(() => buildFlipbook().catch(handleLoadError));
					}
				}
			}
			function handlePageError(error) {
				console.error(error);
				const status = document.getElementById("fullscreenStatus");
				status.textContent = "A page could not render. Turn back and try again.";
				status.hidden = false;
			}

			function updateNavButtons() {
				const hasPrev = currentPageIndex > 0;
				const visibleCount = pageFlip?.getOrientation() === "landscape" && (!bookLayout?.showCover || currentPageIndex > 0) ? 2 : 1;
				const hasNext = bookLayout && currentPageIndex + visibleCount < bookLayout.entries.length;
				prevBtn.disabled = !hasPrev;
				nextBtn.disabled = !hasNext;
			}

			function stepZoom(direction) {
				if (direction > 0) {
					const nextLevel = ZOOM_LEVELS.find(
						(level) => level > zoomLevel + 0.001
					);
					setZoom(nextLevel || ZOOM_LEVELS.at(-1));
					return;
				}

				const prevLevel = [...ZOOM_LEVELS]
					.reverse()
					.find((level) => level < zoomLevel - 0.001);
				setZoom(prevLevel || ZOOM_LEVELS[0]);
			}

			prevBtn.addEventListener("click", () => {
				if (!pageFlip || currentPageIndex <= 0) return;
				pageFlip.flipPrev("top");
			});

			nextBtn.addEventListener("click", () => {
				if (!pageFlip || nextBtn.disabled) return;
				pageFlip.flipNext("top");
			});

			window.addEventListener("keydown", (event) => {
                if (!pageFlip || isBuilding || pageFlip.getState() !== "read") return;
                if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
                if (event.target?.closest?.('input, textarea, select, [contenteditable="true"], dialog[open]')) return;
                if (document.getElementById("driveDialog")?.open) return;
                if (event.key === "ArrowLeft" && !prevBtn.disabled) {
                    event.preventDefault();
                    pageFlip.flipPrev("top");
                } else if (event.key === "ArrowRight" && !nextBtn.disabled) {
                    event.preventDefault();
                    pageFlip.flipNext("top");
                }
            });

            zoomInBtn.addEventListener("click", () => stepZoom(1));
			zoomOutBtn.addEventListener("click", () => stepZoom(-1));
			zoomResetBtn.addEventListener("click", () => setZoom(DEFAULT_ZOOM));

			let resizeTimer = null;
			window.addEventListener("resize", () => {
				if (!pdfDoc) return;
				clearTimeout(resizeTimer);
				resizeTimer = setTimeout(() => {
					currentPageIndex = pageFlip
						? pageFlip.getCurrentPageIndex()
						: currentPageIndex;
					buildFlipbook().catch(handleLoadError);
				}, 180);
			});

			function handleLoadError(err) {
				console.error(err);
				loader.classList.add("load-error");
				loader.style.display = "block";

				if (window.location.protocol === "file:") {
					loader.textContent =
						"PDF could not load from file://. Start a local server in this folder, then open http://localhost:8000.";
					return;
				}

				loader.textContent = `Failed to load PDF: ${err.message}`;
			}

			flipSoundEl.addEventListener("ended", () => { flipSoundState = "idle"; flipSoundEl.currentTime = 0; flipSoundEl.playbackRate = NORMAL_FLIP_PLAYBACK_RATE; });

			window.loadFlipbookSource = async function(source) {
				if (isBuilding) throw new Error("Please wait for the current book to finish loading.");
				document.body.classList.remove("viewer-ready");
				loader.classList.remove("load-error");
				const task = pdfjsLib.getDocument({ ...source, isEvalSupported: false });
				const nextDoc = await task.promise;
				const oldDoc = pdfDoc;
				if (lazyPages) await lazyPages.close();
				lazyPages = null;
				pdfDoc = nextDoc;
				bookLayout = null;
				currentPageIndex = 0;
				suppressFlipSound = true;
				try { await buildFlipbook(); }
				finally { if (oldDoc) await oldDoc.destroy(); }
			};
